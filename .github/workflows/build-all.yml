name: Build All (iOS + Android)

on:
    workflow_dispatch:
        inputs:
            url:
                description: '网站地址（必填）'
                required: true
                default: ''
            app_name:
                description: '应用名称（必填）'
                required: true
                default: ''
            bundle_id:
                description: 'Bundle ID（必填，如 com.makebl.mail）'
                required: true
                default: ''
            app_icon:
                description: '应用图标 URL（留空用默认图标）'
                required: false
                default: ''
            version:
                description: '版本号（留空自动+1）'
                required: false
                default: ''
            custom_js:
                description: '自定义注入脚本（留空用默认：禁止跳转+下拉刷新）'
                required: false
                default: ''

permissions:
    contents: write

jobs:
    ios:
        name: iOS IPA
        runs-on: macos-26
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Get Version
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  INPUT_VERSION: ${{ inputs.version }}
              run: |
                  if [ -n "$INPUT_VERSION" ]; then
                    VERSION="$INPUT_VERSION"
                  else
                    LATEST=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null | grep '^ios-v' | sed 's/^ios-v//' | sort -V | tail -1 || echo "")
                    if [ -z "$LATEST" ]; then
                      VERSION="0.0.1"
                    else
                      MAJOR=$(echo "$LATEST" | cut -d. -f1)
                      MINOR=$(echo "$LATEST" | cut -d. -f2)
                      PATCH=$(echo "$LATEST" | cut -d. -f3)
                      PATCH=$((PATCH + 1))
                      VERSION="${MAJOR}.${MINOR}.${PATCH}"
                    fi
                  fi
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
                  echo "Version: $VERSION"

            - name: Download App Icon
              shell: bash
              env:
                  APP_ICON: ${{ inputs.app_icon }}
              run: |
                  if [ -n "$APP_ICON" ]; then
                    echo "下载应用图标: $APP_ICON"
                    curl -sL -o icon-src "$APP_ICON" 2>/dev/null || echo "下载失败"
                    if [ -f icon-src ]; then
                      echo "下载成功"
                      file -b icon-src
                      ls -la icon-src
                    else
                      echo "下载失败，将使用占位图标"
                    fi
                  else
                    echo "未提供图标 URL，使用默认"
                  fi

            - name: Patch ppconfig.json
              shell: bash
              env:
                  APP_NAME: ${{ inputs.app_name }}
                  APP_URL: ${{ inputs.url }}
                  BUNDLE_ID: ${{ inputs.bundle_id }}
                  VERSION: ${{ env.VERSION }}
                  CLEAR_CACHE: ${{ inputs.clear_cache }}
              run: |
                  node -e "
                    const fs = require('fs');
                    const p = 'scripts/ppconfig.json';
                    const c = JSON.parse(fs.readFileSync(p, 'utf8'));
                    c.android.name = process.env.APP_NAME;
                    c.android.showName = process.env.APP_NAME;
                    c.android.webUrl = process.env.APP_URL;
                    c.android.id = process.env.BUNDLE_ID;
                    c.android.version = process.env.VERSION;
                    c.android.clearCache = process.env.CLEAR_CACHE === 'true';
                    if (!c.android.input) c.android.input = './app-icon.png';
                    if (!c.android.output) c.android.output = './res';
                    if (!c.android.copyTo) c.android.copyTo = './app/src/main/res';
                    if (!c.android.isHtml) c.android.isHtml = false;
                    if (!c.android.pubBody) c.android.pubBody = c.android.desc || 'App packaged by PakePlus';
                    if (!c.android.icon) c.android.icon = './app-icon.png';
                    if (!c.android.rounded) c.android.rounded = true;
                    if (!c.android.androidResDir) c.android.androidResDir = './app/src/main/res';
                    fs.writeFileSync(p, JSON.stringify(c, null, 4));
                    console.log('Patched Android config:');
                    console.log(JSON.stringify(c.android, null, 2));
                  "

            - name: Inject Custom JS
              shell: bash
              env:
                  CUSTOM_JS: ${{ inputs.custom_js }}
              run: |
                  if [ -n "$CUSTOM_JS" ]; then
                    echo "使用用户自定义脚本"
                    if [ -f app/src/main/assets/custom.js ]; then
                      printf '%s' "$CUSTOM_JS" > app/src/main/assets/custom.js
                      echo "已覆盖 app/src/main/assets/custom.js"
                    elif [ -f assets/custom.js ]; then
                      printf '%s' "$CUSTOM_JS" > assets/custom.js
                      echo "已覆盖 assets/custom.js"
                    else
                      echo "警告：未找到 Android custom.js 路径"
                      find . -name "custom.js" -type f 2>/dev/null | head -5
                    fi
                  else
                    echo "使用默认脚本"
                  fi


            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'
                  cache: gradle

            - name: Set up Android SDK
              run: |
                  export ANDROID_HOME=/usr/local/lib/android/sdk
                  export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
                  yes | sdkmanager --licenses
                  sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

            - uses: pnpm/action-setup@v4
              with:
                  version: 10
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22.14.0

            - name: Install ImageMagick
              run: |
                  sudo apt-get update
                  sudo apt-get install imagemagick

            - name: Install Dependencies
              run: pnpm install --no-frozen-lockfile

            - name: Process App Icon
              shell: bash
              run: |
                  echo "=== 图标处理开始 ==="
                  rm -f app-icon.png
                  echo "安装 sharp (支持 JPEG/PNG/GIF/WebP/SVG/ICO/BMP/TIFF)..."
                  npm install sharp --no-save 2>&1 | tail -3
                  cat > /tmp/convert-icon.js << 'SCRIPT'
                  const fs = require('fs');
                  async function main() {
                      const input = 'icon-src';
                      const output = 'app-icon.png';
                      let sharp;
                      try { sharp = require('sharp'); } catch(e) {
                          console.log('sharp 不可用: ' + e.message);
                      }
                      if (!fs.existsSync(input)) {
                          console.log('无自定义图标，生成占位图标');
                          await createPlaceholder(sharp, output);
                          return;
                      }
                      const buf = fs.readFileSync(input);
                      if (buf.length < 100) {
                          console.log('文件太小（' + buf.length + '字节），可能是错误响应');
                          await createPlaceholder(sharp, output);
                          return;
                      }
                      if (sharp) {
                          try {
                              await sharp(buf)
                                  .resize(512, 512, { fit: 'cover', position: 'center', background: { r: 99, g: 102, b: 241, alpha: 1 } })
                                  .png()
                                  .toFile(output);
                              const info = await sharp(fs.readFileSync(output)).metadata();
                              console.log('sharp 转换成功: ' + info.width + 'x' + info.height + ' ' + info.format);
                              return;
                          } catch (err) {
                              console.log('sharp 转换失败: ' + err.message);
                          }
                      }
                      try {
                          const { execSync } = require('child_process');
                          execSync('convert "icon-src" -resize 512x512 -background none -gravity center -extent 512x512 app-icon.png 2>&1', { stdio: 'inherit' });
                          if (fs.existsSync(output) && fs.statSync(output).size > 100) {
                              console.log('ImageMagick 转换成功');
                              return;
                          }
                      } catch (e) {
                          console.log('ImageMagick 转换失败');
                      }
                      await createPlaceholder(sharp, output);
                  }
                  async function createPlaceholder(sharp, output) {
                      if (sharp) {
                          const svg = '<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg"><rect width="512" height="512" fill="#6366F1" rx="80"/><text x="256" y="286" font-size="120" font-family="sans-serif" fill="white" text-anchor="middle">App</text></svg>';
                          await sharp(Buffer.from(svg)).png().toFile(output);
                      } else {
                          const { execSync } = require('child_process');
                          execSync('convert -size 512x512 xc:"#6366F1" app-icon.png 2>&1', { stdio: 'inherit' });
                      }
                      console.log('占位图标已生成 (512x512)');
                  }
                  main().catch(err => { console.error('图标处理出错:', err.message); process.exit(1); });
                  SCRIPT
                  node /tmp/convert-icon.js
                  if [ -f app-icon.png ] && [ "$(stat -c%s app-icon.png 2>/dev/null || echo 0)" -gt 100 ]; then
                    echo "=== 图标处理完成 ==="
                    file app-icon.png
                    ls -la app-icon.png
                  else
                    echo "=== 最终兜底 ==="
                    convert -size 512x512 xc:"#6366F1" app-icon.png 2>&1 || true
                  fi
                  rm -f icon-src

            - name: Patch ppworker for Resilience
              shell: bash
              run: |
                  sed -i 's/generateAdaptiveIcons(input, outPath)/try { generateAdaptiveIcons(input, outPath); } catch (e) { console.log("⚠️ Icon generation failed:", e.message); }/' scripts/ppworker.cjs
                  echo "已添加 try-catch 保护到 ppworker.cjs"

            - name: Run ppworker
              run: node ./scripts/ppworker.cjs || true

            - name: Patch Android Cache Logic
              run: |
                  # 修改 MainActivity.kt: clearCache(true) 改为只清 HTTP 缓存，保留 Cookie
                  MAIN_FILE="app/src/main/java/com/app/pakeplus/MainActivity.kt"
                  if [ -f "" ]; then
                    # 替换 webView.clearCache(true) 为只清 HTTP 缓存但保留 Cookie 的实现
                    sed -i 's|webView.clearCache(true)|// 只清 HTTP 缓存，保留 Cookie/localStorage\n            webView.clearCache(false)\n            android.webkit.WebStorage.getInstance().deleteAllData()\n            try {\n                val cm = android.webkit.CookieManager.getInstance()\n                cm.flush()\n            } catch (e: Exception) {\n                e.printStackTrace()\n            }|' ""
                    echo "已修改 MainActivity.kt: clearCache 保留 Cookie"
                  else
                    echo "未找到 MainActivity.kt，跳过"
                  fi

            - name: Grant Execute Permission
              run: chmod +x ./gradlew

            - name: Patch Build Gradle for Debug Signing
              run: |
                  # 让 debug build 使用默认 Android debug keystore，避免 release 签名配置导致构建失败
                  if [ -f app/build.gradle ]; then
                    # 注释掉 release signingConfig 的引用，使用默认 debug 签名
                    sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' app/build.gradle
                    echo "已修改 build.gradle 使用 debug 签名"
                  elif [ -f app/build.gradle.kts ]; then
                    sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/g' app/build.gradle.kts
                    echo "已修改 build.gradle.kts 使用 debug 签名"
                  fi
                  # 生成默认 debug keystore（如果不存在）
                  mkdir -p ~/.android
                  if [ ! -f ~/.android/debug.keystore ]; then
                    keytool -genkeypair -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
                  fi

            - name: Build APK
              run: ./gradlew assembleDebug --no-daemon

            - name: Rename APK
              shell: bash
              env:
                  VERSION: ${{ env.VERSION }}
                  BUNDLE_ID: ${{ inputs.bundle_id }}
              run: |
                  cd app/build/outputs/apk/debug/
                  APK_NAME="${BUNDLE_ID}-android-${VERSION}.apk"
                  echo "APK 文件名: $APK_NAME"
                  cp app-debug.apk "$APK_NAME"
                  echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  files: app/build/outputs/apk/debug/${{ env.APK_NAME }}
                  tag_name: android-v${{ env.VERSION }}
                  name: ${{ inputs.app_name }} Android v${{ env.VERSION }}
                  body: |
                      网址: ${{ inputs.url }}
                      名称: ${{ inputs.app_name }}
                      Bundle ID: ${{ inputs.bundle_id }}
                      版本: ${{ env.VERSION }}
                      平台: Android
                  draft: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
