name: Build All (iOS + Android)

on:
    workflow_dispatch:
        inputs:
            url:
                description: '🌐 网站地址（必填）'
                required: true
                default: 'https://langge.cf:8080/dashboard'
            app_name:
                description: '📱 应用名称（必填）'
                required: true
                default: '自用邮箱'
            bundle_id:
                description: '🆔 Bundle ID（必填，如 com.makebl.mail）'
                required: true
                default: 'com.makebl.mail'
            version:
                description: '🔢 版本号（留空自动+1）'
                required: false
                default: ''

permissions:
    contents: write

jobs:
    ios:
        name: 📱 iOS IPA
        runs-on: macos-26
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Get Version
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if [ -n "${{ inputs.version }}" ]; then
                    VERSION="${{ inputs.version }}"
                  else
                    LATEST=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[].tagName' | grep '^ios-v' | sed 's/^ios-v//' | sort -V | tail -1 || echo "")
                    if [ -z "$LATEST" ]; then
                      VERSION="0.0.1"
                    else
                      MAJOR=$(echo "$LATEST" | cut -d. -f1)
                      MINOR=$(echo "$LATEST" | cut -d. -f2)
                      PATCH=$(echo "$LATEST" | cut -d. -f3)
                      PATCH=$((PATCH + 1))
                      VERSION="${MAJOR}.${MINOR}.${PATCH}"
                    fi
                  fi
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
                  echo "Version: $VERSION"

            - name: Patch ppconfig.json
              shell: bash
              run: |
                  node -e "
                  const fs = require('fs');
                  const p = 'scripts/ppconfig.json';
                  const c = JSON.parse(fs.readFileSync(p, 'utf8'));
                  c.ios.name = '${{ inputs.app_name }}';
                  c.ios.showName = '${{ inputs.app_name }}';
                  c.ios.webUrl = '${{ inputs.url }}';
                  c.ios.id = '${{ inputs.bundle_id }}';
                  c.ios.version = process.env.VERSION;
                  fs.writeFileSync(p, JSON.stringify(c, null, 4));
                  console.log('Patched iOS config:', JSON.stringify(c.ios, null, 2));
                  "

            - name: Setup Xcode
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22.14.0
                  cache: pnpm

            - name: Install Dependencies
              run: pnpm install

            - name: Run ppworker
              run: pnpm pp:worker

            - name: Build IPA
              run: |
                  xcodebuild -project PakePlus.xcodeproj -scheme PakePlus -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
                  mkdir -p Payload
                  cp -R build/Build/Products/Release-iphoneos/PakePlus.app Payload/
                  if [ "${ISHTML:-false}" = "true" ]; then
                    cp -R ./scripts/www/* ./Payload/PakePlus.app/
                  fi
                  zip -r PakePlus-ios-${{ env.VERSION }}.ipa Payload
                  ls -la PakePlus-ios-${{ env.VERSION }}.ipa

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  files: PakePlus-ios-${{ env.VERSION }}.ipa
                  tag_name: ios-v${{ env.VERSION }}
                  name: ${{ inputs.app_name }} iOS v${{ env.VERSION }}
                  body: |
                      🌐 网址: ${{ inputs.url }}
                      📱 名称: ${{ inputs.app_name }}
                      🆔 Bundle ID: ${{ inputs.bundle_id }}
                      🔢 版本: ${{ env.VERSION }}
                      📦 平台: iOS
                  draft: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    android:
        name: 🤖 Android APK
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Android Source
              uses: actions/checkout@v4
              with:
                  repository: Sjj1024/PakePlus-Android

            - name: Get Version
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if [ -n "${{ inputs.version }}" ]; then
                    VERSION="${{ inputs.version }}"
                  else
                    LATEST=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[].tagName' | grep '^android-v' | sed 's/^android-v//' | sort -V | tail -1 || echo "")
                    if [ -z "$LATEST" ]; then
                      VERSION="0.0.1"
                    else
                      MAJOR=$(echo "$LATEST" | cut -d. -f1)
                      MINOR=$(echo "$LATEST" | cut -d. -f2)
                      PATCH=$(echo "$LATEST" | cut -d. -f3)
                      PATCH=$((PATCH + 1))
                      VERSION="${MAJOR}.${MINOR}.${PATCH}"
                    fi
                  fi
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
                  echo "Version: $VERSION"

            - name: Patch ppconfig.json
              shell: bash
              run: |
                  node -e "
                  const fs = require('fs');
                  const p = 'scripts/ppconfig.json';
                  const c = JSON.parse(fs.readFileSync(p, 'utf8'));
                  c.android.name = '${{ inputs.app_name }}';
                  c.android.showName = '${{ inputs.app_name }}';
                  c.android.webUrl = '${{ inputs.url }}';
                  c.android.id = '${{ inputs.bundle_id }}';
                  c.android.version = process.env.VERSION;
                  fs.writeFileSync(p, JSON.stringify(c, null, 4));
                  console.log('Patched Android config:', JSON.stringify(c.android, null, 2));
                  "

            - name: Set up JDK 17
              uses: actions/setup-java@v3
              with:
                  distribution: 'temurin'
                  java-version: '17'
                  cache: gradle

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22.14.0
                  cache: pnpm

            - name: Install ImageMagick
              run: |
                  sudo apt-get update
                  sudo apt-get install imagemagick

            - name: Install Dependencies
              run: pnpm install

            - name: Run ppworker
              run: pnpm pp:worker

            - name: Grant Execute Permission
              run: chmod +x ./gradlew

            - name: Build APK
              run: ./gradlew assembleDebug --no-daemon

            - name: Rename APK
              run: |
                  cd app/build/outputs/apk/debug/
                  cp app-debug.apk PakePlus-android-${{ env.VERSION }}.apk

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  files: app/build/outputs/apk/debug/PakePlus-android-${{ env.VERSION }}.apk
                  tag_name: android-v${{ env.VERSION }}
                  name: ${{ inputs.app_name }} Android v${{ env.VERSION }}
                  body: |
                      🌐 网址: ${{ inputs.url }}
                      📱 名称: ${{ inputs.app_name }}
                      🆔 Bundle ID: ${{ inputs.bundle_id }}
                      🔢 版本: ${{ env.VERSION }}
                      📦 平台: Android
                  draft: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
