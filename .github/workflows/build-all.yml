name: Build All (iOS + Android)

on:
    workflow_dispatch:
        inputs:
            url:
                description: '网站地址（必填）'
                required: true
                default: ''
            app_name:
                description: '应用名称（必填）'
                required: true
                default: ''
            bundle_id:
                description: 'Bundle ID（必填，如 com.makebl.mail）'
                required: true
                default: ''
            app_icon:
                description: '应用图标 URL（留空用默认图标）'
                required: false
                default: ''
            version:
                description: '版本号（留空自动+1）'
                required: false
                default: ''
            custom_js:
                description: '自定义注入脚本（留空用默认：禁止跳转+下拉刷新）'
                required: false
                default: ''
            clear_cache:
                description: '每次启动清理缓存（保留 Cookie/登录状态）'
                required: false
                default: 'true'

permissions:
    contents: write

jobs:
    ios:
        name: iOS IPA
        runs-on: macos-26
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Get Version
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  INPUT_VERSION: ${{ inputs.version }}
              run: |
                  if [ -n "$INPUT_VERSION" ]; then
                    VERSION="$INPUT_VERSION"
                  else
                    LATEST=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null | grep '^ios-v' | sed 's/^ios-v//' | sort -V | tail -1 || echo "")
                    if [ -z "$LATEST" ]; then
                      VERSION="0.0.1"
                    else
                      MAJOR=$(echo "$LATEST" | cut -d. -f1)
                      MINOR=$(echo "$LATEST" | cut -d. -f2)
                      PATCH=$(echo "$LATEST" | cut -d. -f3)
                      PATCH=$((PATCH + 1))
                      VERSION="${MAJOR}.${MINOR}.${PATCH}"
                    fi
                  fi
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
                  echo "Version: $VERSION"

            - name: Download App Icon
              shell: bash
              env:
                  APP_ICON: ${{ inputs.app_icon }}
              run: |
                  if [ -n "$APP_ICON" ]; then
                    echo "下载应用图标: $APP_ICON"
                    curl -sL -o app-icon.png "$APP_ICON" || echo "下载失败，使用默认图标"
                  else
                    echo "未提供图标 URL，使用默认 app-icon.png"
                  fi
                  ls -la app-icon.png

            - name: Patch ppconfig.json
              shell: bash
              env:
                  APP_NAME: ${{ inputs.app_name }}
                  APP_URL: ${{ inputs.url }}
                  BUNDLE_ID: ${{ inputs.bundle_id }}
                  VERSION: ${{ env.VERSION }}
                  CLEAR_CACHE: ${{ inputs.clear_cache }}
              run: |
                  echo "=== 验证 env ==="
                  echo "APP_NAME: $APP_NAME"
                  echo "APP_URL: $APP_URL"
                  echo "BUNDLE_ID: $BUNDLE_ID"
                  echo "VERSION: $VERSION"
                  echo "=== 写入 ppconfig.json ==="
                  node -e "
                    const fs = require('fs');
                    const p = 'scripts/ppconfig.json';
                    const c = JSON.parse(fs.readFileSync(p, 'utf8'));
                    c.ios.name = process.env.APP_NAME;
                    c.ios.showName = process.env.APP_NAME;
                    c.ios.webUrl = process.env.APP_URL;
                    c.ios.id = process.env.BUNDLE_ID;
                    c.ios.version = process.env.VERSION;
                    c.ios.clearCache = process.env.CLEAR_CACHE === 'true';
                    fs.writeFileSync(p, JSON.stringify(c, null, 4));
                    console.log('Patched iOS config:');
                    console.log(JSON.stringify(c.ios, null, 2));
                  "
            - name: Inject Custom JS
              shell: bash
              env:
                  CUSTOM_JS: ${{ inputs.custom_js }}
              run: |
                  if [ -n "$CUSTOM_JS" ]; then
                    echo "使用用户自定义脚本"
                    printf '%s' "$CUSTOM_JS" > PakePlus/custom.js
                    echo "custom.js 已覆盖（长度: $(wc -c < PakePlus/custom.js) 字节）"
                  else
                    echo "使用默认脚本（禁止跳转+下拉刷新）"
                  fi

                  echo "=== 验证 ppconfig.json ==="
                  cat scripts/ppconfig.json | grep -E 'name|webUrl|id|version'

            - name: Setup Xcode
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            - uses: pnpm/action-setup@v4
              with:
                  version: 10
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22.14.0

            - name: Install Dependencies
              run: pnpm install --no-frozen-lockfile

            - name: Run ppworker
              run: |
                  pnpm pp:worker
                  echo "=== 验证 Info.plist 内容 ==="
                  grep -A1 'CFBundleDisplayName' PakePlus/Info.plist || echo "CFBundleDisplayName not found"
                  grep -A1 'WEBURL' PakePlus/Info.plist || echo "WEBURL not found"

            - name: Generate AppIcon
              run: |
                  echo "Installing appicon tool..."
                  brew install Nonchalant/appicon/appicon
                  echo "Checking icon file..."
                  if [ ! -f app-icon.png ]; then
                    echo "app-icon.png not found, using default"
                    exit 0
                  fi
                  ICON_SIZE=$(sips -g pixelWidth -g pixelHeight app-icon.png 2>/dev/null | grep pixel | awk '{print $2}')
                  echo "Original icon dimensions: $ICON_SIZE"
                  WIDTH=$(sips -g pixelWidth app-icon.png | grep pixelWidth | awk '{print $2}')
                  HEIGHT=$(sips -g pixelHeight app-icon.png | grep pixelHeight | awk '{print $2}')
                  if [ "$WIDTH" -ne 1024 ] || [ "$HEIGHT" -ne 1024 ]; then
                    echo "Icon size is ${WIDTH}x${HEIGHT}, resizing to 1024x1024..."
                    # 先转换为 PNG 格式（防止 ico/webp 等格式导致 sips 缩放失败）
                    sips -s format png app-icon.png --out app-icon.tmp.png 2>/dev/null
                    if [ -f app-icon.tmp.png ]; then
                      # 非正方形先裁剪再缩放
                      if [ "$WIDTH" != "$HEIGHT" ]; then
                        sips -c 1024 1024 app-icon.tmp.png --out app-icon.tmp.png 2>/dev/null
                      fi
                      sips -z 1024 1024 app-icon.tmp.png --out app-icon.tmp.png 2>/dev/null
                      mv app-icon.tmp.png app-icon.png
                    else
                      echo "Warning: cannot resize icon, will use default"
                      rm -f app-icon.png
                    fi
                  fi
                  echo "Final icon size:"
                  sips -g pixelWidth -g pixelHeight app-icon.png
                  echo "Generating AppIcon..."
                  appicon app-icon.png --output-path ./PakePlus/Assets.xcassets/AppIcon.appiconset
                  echo "AppIcon generated successfully"
                  ls -la ./PakePlus/Assets.xcassets/AppIcon.appiconset/ | head -10

            - name: Build IPA
              shell: bash
              env:
                  VERSION: ${{ env.VERSION }}
                  BUNDLE_ID: ${{ inputs.bundle_id }}
              run: |
                  set +e
                  xcodebuild -project PakePlus.xcodeproj -scheme PakePlus -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
                  BUILD_RESULT=$?
                  echo "xcodebuild exit code: $BUILD_RESULT"
                  if [ $BUILD_RESULT -ne 0 ]; then
                    echo "Build failed"
                    exit 1
                  fi
                  APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "PakePlus.app" | grep Release-iphoneos | head -n 1)
                  echo "APP_PATH is [$APP_PATH]"
                  if [ -z "$APP_PATH" ]; then
                      echo "ERROR: PakePlus.app not found in DerivedData"
                      find ~/Library/Developer/Xcode/DerivedData -type d -name "*.app" 2>/dev/null | head -20
                      exit 1
                  fi
                  echo "=== 验证编译后的 Info.plist ==="
                  plutil -p "$APP_PATH/Info.plist" | grep -E 'CFBundleDisplayName|WEBURL'
                  mkdir -p Payload
                  cp -R "$APP_PATH" Payload/
                  if [ "${ISHTML:-false}" = "true" ]; then
                      cp -R ./scripts/www/* ./Payload/PakePlus.app/
                  fi
                  IPA_NAME="${BUNDLE_ID}-ios-${VERSION}.ipa"
                  echo "打包文件名: $IPA_NAME"
                  zip -r "$IPA_NAME" Payload
                  ls -la "$IPA_NAME"
                  echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  files: ${{ env.IPA_NAME }}
                  tag_name: ios-v${{ env.VERSION }}
                  name: ${{ inputs.app_name }} iOS v${{ env.VERSION }}
                  body: |
                      网址: ${{ inputs.url }}
                      名称: ${{ inputs.app_name }}
                      Bundle ID: ${{ inputs.bundle_id }}
                      版本: ${{ env.VERSION }}
                      平台: iOS
                  draft: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    android:
        name: Android APK
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Android Source
              uses: actions/checkout@v5
              with:
                  repository: Sjj1024/PakePlus-Android

            - name: Get Version
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  INPUT_VERSION: ${{ inputs.version }}
              run: |
                  if [ -n "$INPUT_VERSION" ]; then
                    VERSION="$INPUT_VERSION"
                  else
                    LATEST=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null | grep '^android-v' | sed 's/^android-v//' | sort -V | tail -1 || echo "")
                    if [ -z "$LATEST" ]; then
                      VERSION="0.0.1"
                    else
                      MAJOR=$(echo "$LATEST" | cut -d. -f1)
                      MINOR=$(echo "$LATEST" | cut -d. -f2)
                      PATCH=$(echo "$LATEST" | cut -d. -f3)
                      PATCH=$((PATCH + 1))
                      VERSION="${MAJOR}.${MINOR}.${PATCH}"
                    fi
                  fi
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
                  echo "Version: $VERSION"
            - name: Download App Icon
              shell: bash
              env:
                  APP_ICON: ${{ inputs.app_icon }}
              run: |
                  if [ -n "$APP_ICON" ]; then
                    echo "下载应用图标: $APP_ICON"
                    curl -sL -o icon-src "$APP_ICON" 2>/dev/null || echo "下载失败"
                    if [ -f icon-src ]; then
                      echo "下载成功"
                      file -b icon-src
                      ls -la icon-src
                    else
                      echo "下载失败，将使用占位图标"
                    fi
                  else
                    echo "未提供图标 URL，使用默认"
                  fi

            - name: Patch ppconfig.json
              shell: bash
              env:
                  APP_NAME: ${{ inputs.app_name }}
                  APP_URL: ${{ inputs.url }}
                  BUNDLE_ID: ${{ inputs.bundle_id }}
                  VERSION: ${{ env.VERSION }}
                  CLEAR_CACHE: ${{ inputs.clear_cache }}
              run: |
                  node -e "
                    const fs = require('fs');
                    const p = 'scripts/ppconfig.json';
                    const c = JSON.parse(fs.readFileSync(p, 'utf8'));
                    c.android.name = process.env.APP_NAME;
                    c.android.showName = process.env.APP_NAME;
                    c.android.webUrl = process.env.APP_URL;
                    c.android.id = process.env.BUNDLE_ID;
                    c.android.version = process.env.VERSION;
                    c.android.clearCache = process.env.CLEAR_CACHE === 'true';
                    if (!c.android.input) c.android.input = './app-icon.png';
                    if (!c.android.output) c.android.output = './res';
                    if (!c.android.copyTo) c.android.copyTo = './app/src/main/res';
                    if (!c.android.isHtml) c.android.isHtml = false;
                    if (!c.android.pubBody) c.android.pubBody = c.android.desc || 'App packaged by PakePlus';
                    if (!c.android.icon) c.android.icon = './app-icon.png';
                    if (!c.android.rounded) c.android.rounded = true;
                    if (!c.android.androidResDir) c.android.androidResDir = './app/src/main/res';
                    fs.writeFileSync(p, JSON.stringify(c, null, 4));
                    console.log('Patched Android config:');
                    console.log(JSON.stringify(c.android, null, 2));
                  "

            - name: Inject Custom JS
              shell: bash
              env:
                  CUSTOM_JS: ${{ inputs.custom_js }}
              run: |
                  if [ -n "$CUSTOM_JS" ]; then
                    echo "使用用户自定义脚本"
                    if [ -f app/src/main/assets/custom.js ]; then
                      printf '%s' "$CUSTOM_JS" > app/src/main/assets/custom.js
                      echo "已覆盖 app/src/main/assets/custom.js"
                    elif [ -f assets/custom.js ]; then
                      printf '%s' "$CUSTOM_JS" > assets/custom.js
                      echo "已覆盖 assets/custom.js"
                    else
                      echo "警告：未找到 Android custom.js 路径"
                      find . -name "custom.js" -type f 2>/dev/null | head -5
                    fi
                  else
                    echo "使用默认脚本"
                  fi

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'
                  cache: gradle

            - name: Set up Android SDK
              run: |
                  export ANDROID_HOME=/usr/local/lib/android/sdk
                  export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
                  yes | sdkmanager --licenses
                  sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

            - uses: pnpm/action-setup@v4
              with:
                  version: 10
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22.14.0

            - name: Install ImageMagick
              run: |
                  sudo apt-get update
                  sudo apt-get install imagemagick

            - name: Install Dependencies
              run: pnpm install --no-frozen-lockfile

            - name: Process App Icon
              shell: bash
              run: |
                  echo "=== 图标处理开始 ==="
                  rm -f app-icon.png
                  echo "安装 sharp (支持 JPEG/PNG/GIF/WebP/SVG/ICO/BMP/TIFF)..."
                  npm install --prefix /tmp sharp 2>&1 | tail -3
                  export NODE_PATH=/tmp/node_modules
                  cat > /tmp/convert-icon.js << 'SCRIPT'
                  const fs = require('fs');
                  async function main() {
                      const input = 'icon-src';
                      const output = 'app-icon.png';
                      let sharp;
                      try { sharp = require('sharp'); } catch(e) {
                          console.log('sharp 不可用: ' + e.message);
                      }
                      if (!fs.existsSync(input)) {
                          console.log('无自定义图标，生成占位图标');
                          await createPlaceholder(sharp, output);
                          return;
                      }
                      const buf = fs.readFileSync(input);
                      if (buf.length < 100) {
                          console.log('文件太小（' + buf.length + '字节），可能是错误响应');
                          await createPlaceholder(sharp, output);
                          return;
                      }
                      if (sharp) {
                          try {
                              await sharp(buf)
                                  .resize(512, 512, { fit: 'cover', position: 'center', background: { r: 99, g: 102, b: 241, alpha: 1 } })
                                  .png()
                                  .toFile(output);
                              const info = await sharp(fs.readFileSync(output)).metadata();
                              console.log('sharp 转换成功: ' + info.width + 'x' + info.height + ' ' + info.format);
                              return;
                          } catch (err) {
                              console.log('sharp 转换失败: ' + err.message);
                          }
                      }
                      try {
                          const { execSync } = require('child_process');
                          execSync('convert "icon-src" -resize 512x512 -background none -gravity center -extent 512x512 app-icon.png 2>&1', { stdio: 'inherit' });
                          if (fs.existsSync(output) && fs.statSync(output).size > 100) {
                              console.log('ImageMagick 转换成功');
                              return;
                          }
                      } catch (e) {
                          console.log('ImageMagick 转换失败');
                      }
                      await createPlaceholder(sharp, output);
                  }
                  async function createPlaceholder(sharp, output) {
                      if (sharp) {
                          const svg = '<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg"><rect width="512" height="512" fill="#6366F1" rx="80"/><text x="256" y="286" font-size="120" font-family="sans-serif" fill="white" text-anchor="middle">App</text></svg>';
                          await sharp(Buffer.from(svg)).png().toFile(output);
                      } else {
                          const { execSync } = require('child_process');
                          execSync('convert -size 512x512 xc:"#6366F1" app-icon.png 2>&1', { stdio: 'inherit' });
                      }
                      console.log('占位图标已生成 (512x512)');
                  }
                  main().catch(err => { console.error('图标处理出错:', err.message); process.exit(1); });
                  SCRIPT
                  node /tmp/convert-icon.js
                  if [ -f app-icon.png ] && [ "$(stat -c%s app-icon.png 2>/dev/null || echo 0)" -gt 100 ]; then
                    echo "=== 图标处理完成 ==="
                    file app-icon.png
                    ls -la app-icon.png
                  else
                    echo "=== 最终兜底 ==="
                    convert -size 512x512 xc:"#6366F1" app-icon.png 2>&1 || true
                  fi
                  rm -f icon-src

            - name: Patch ppworker for Resilience
              shell: bash
              run: |
                  sed -i 's/generateAdaptiveIcons(input, outPath)/try { generateAdaptiveIcons(input, outPath); } catch (e) { console.log("⚠️ Icon generation failed:", e.message); }/' scripts/ppworker.cjs
                  echo "已添加 try-catch 保护到 ppworker.cjs"

            - name: Run ppworker
              run: node ./scripts/ppworker.cjs || true
            - name: Patch Android Cookie & Cache Logic
              run: |
                  node -e "
                    const fs = require('fs');
                    const f = 'app/src/main/java/com/app/pakeplus/MainActivity.kt';
                    if (!fs.existsSync(f)) { console.log('未找到，跳过'); process.exit(0); }
                    let c = fs.readFileSync(f, 'utf8');

                    // 1. 添加 CookieManager import
                    if (!c.includes('import android.webkit.CookieManager')) {
                      c = c.replace(
                        'import android.webkit.WebView',
                        'import android.webkit.WebView' + '\\n' + 'import android.webkit.CookieManager'
                      );
                      console.log('已添加 CookieManager import');
                    }

                    // 2. 添加 Cookie 持久化配置（在 // set user agent 之前）
                    if (!c.includes('Cookie 持久化配置')) {
                      const cookieCode = '// Cookie 持久化配置 - 确保登录状态在 App 重启后保留' + '\\n' +
                        '        try {' + '\\n' +
                        '            val cm = CookieManager.getInstance()' + '\\n' +
                        '            cm.setAcceptCookie(true)' + '\\n' +
                        '            cm.acceptThirdPartyCookies(webView)' + '\\n' +
                        '            cm.flush()' + '\\n' +
                        '        } catch (e: Exception) {' + '\\n' +
                        '            e.printStackTrace()' + '\\n' +
                        '        }';
                      c = c.replace('// set user agent', cookieCode + '\\n        // set user agent');
                      console.log('已添加 Cookie 持久化配置');
                    }

                    // 3. 修改 clearCache
                    if (c.includes('webView.clearCache(true)')) {
                      c = c.replace(
                        'webView.clearCache(true)',
                        '// 只清 HTTP 缓存，保留 Cookie 和 localStorage' + '\\n' +
                        '            webView.clearCache(false)' + '\\n' +
                        '            android.webkit.WebStorage.getInstance().deleteAllData()'
                      );
                      console.log('已修改 clearCache 逻辑');
                    }

                    // 4. onPause 时 flush Cookie
                    if (!c.includes('/* 持久化 Cookie */')) {
                      c = c.replace(
                        'webView.onPause()',
                        'webView.onPause()' + '\\n' +
                        '        try { CookieManager.getInstance().flush() /* 持久化 Cookie */ } catch (e: Exception) { e.printStackTrace() }'
                      );
                      console.log('已添加 onPause Cookie flush');
                    }

                    // 5. onDestroy 时 flush Cookie
                    if (!c.includes('/* 确保 Cookie 持久化 */')) {
                      c = c.replace(
                        'webView.destroy()',
                        'webView.destroy()' + '\\n' +
                        '        try { CookieManager.getInstance().flush() /* 确保 Cookie 持久化 */ } catch (e: Exception) { e.printStackTrace() }'
                      );
                      console.log('已添加 onDestroy Cookie flush');
                    }

                    fs.writeFileSync(f, c, 'utf8');
                    console.log('✅ 补丁完成');
                  "

            - name: Grant Execute Permission
              run: chmod +x ./gradlew

            - name: Patch Build Gradle for Debug Signing
              run: |
                  # 让 debug build 使用默认 Android debug keystore，避免 release 签名配置导致构建失败
                  if [ -f app/build.gradle ]; then
                    # 注释掉 release signingConfig 的引用，使用默认 debug 签名
                    sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' app/build.gradle
                    echo "已修改 build.gradle 使用 debug 签名"
                  elif [ -f app/build.gradle.kts ]; then
                    sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/g' app/build.gradle.kts
                    echo "已修改 build.gradle.kts 使用 debug 签名"
                  fi
                  # 生成默认 debug keystore（如果不存在）
                  mkdir -p ~/.android
                  if [ ! -f ~/.android/debug.keystore ]; then
                    keytool -genkeypair -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
                  fi

            - name: Build APK
              run: ./gradlew assembleDebug --no-daemon

            - name: Rename APK
              shell: bash
              env:
                  VERSION: ${{ env.VERSION }}
                  BUNDLE_ID: ${{ inputs.bundle_id }}
              run: |
                  cd app/build/outputs/apk/debug/
                  APK_NAME="${BUNDLE_ID}-android-${VERSION}.apk"
                  echo "APK 文件名: $APK_NAME"
                  cp app-debug.apk "$APK_NAME"
                  echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  files: app/build/outputs/apk/debug/${{ env.APK_NAME }}
                  tag_name: android-v${{ env.VERSION }}
                  name: ${{ inputs.app_name }} Android v${{ env.VERSION }}
                  body: |
                      网址: ${{ inputs.url }}
                      名称: ${{ inputs.app_name }}
                      Bundle ID: ${{ inputs.bundle_id }}
                      版本: ${{ env.VERSION }}
                      平台: Android
                  draft: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
