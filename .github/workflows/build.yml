name: Build IPA (Multi)

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: macos-26
        strategy:
            fail-fast: false
            matrix:
                include:
                    - profile: mail
                      app_name: "自用邮箱"
                      show_name: "自用邮箱"
                      web_url: "https://langge.cf:8080/dashboard"
                      bundle_id: "com.makebl.mail"
                      version: "0.0.1"
                    - profile: admin
                      app_name: "自用管理"
                      show_name: "自用管理"
                      web_url: "https://langge.cf:8080/admin/dashboard"
                      bundle_id: "com.makebl.admin"
                      version: "0.0.1"

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Xcode
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Sync node version and setup cache
              uses: actions/setup-node@v4
              with:
                  node-version: 22.14.0

            - name: Patch ppconfig.json for this matrix profile
              run: |
                  node -e "
                  const fs = require('fs');
                  const p = 'scripts/ppconfig.json';
                  const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
                  cfg.ios.name = process.env.APP_NAME;
                  cfg.ios.showName = process.env.SHOW_NAME;
                  cfg.ios.webUrl = process.env.WEB_URL;
                  cfg.ios.id = process.env.BUNDLE_ID;
                  cfg.ios.version = process.env.VERSION;
                  fs.writeFileSync(p, JSON.stringify(cfg, null, 4));
                  console.log('Patched ios config:');
                  console.log(JSON.stringify(cfg.ios, null, 2));
                  "
              env:
                  APP_NAME: ${{ matrix.app_name }}
                  SHOW_NAME: ${{ matrix.show_name }}
                  WEB_URL: ${{ matrix.web_url }}
                  BUNDLE_ID: ${{ matrix.bundle_id }}
                  VERSION: ${{ matrix.version }}

            - name: Init Project Config
              run: |
                  pnpm install --no-frozen-lockfile
                  pnpm pp:worker

            - name: Generate AppIcon
              run: |
                  echo "Installing appicon tool..."
                  brew install Nonchalant/appicon/appicon
                  echo "Generating AppIcon..."
                  appicon app-icon.png --output-path ./PakePlus/Assets.xcassets/AppIcon.appiconset

            - name: Build for Release
              run: |
                  xcodebuild -project PakePlus.xcodeproj -scheme PakePlus -configuration Release -sdk iphoneos \
                    CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

            - name: Package IPA
              run: |
                  set +e
                  APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "PakePlus.app" | grep Release-iphoneos | head -n 1)
                  echo "APP_PATH is [$APP_PATH]"
                  if [ -z "$APP_PATH" ]; then
                      echo "ERROR: PakePlus.app not found in DerivedData"
                      find ~/Library/Developer/Xcode/DerivedData -type d -name "*.app" 2>/dev/null | head -20
                      exit 1
                  fi
                  mkdir -p Payload
                  cp -R "$APP_PATH" Payload/
                  ISHTML="${{ env.ISHTML }}"
                  echo "ISHTML=$ISHTML"
                  if [ "$ISHTML" = "true" ]; then
                      cp -R ./scripts/www/* ./Payload/PakePlus.app/
                  fi
                  IPA_FILE="PakePlus-${{ matrix.profile }}-${{ matrix.version }}.ipa"
                  zip -r "$IPA_FILE" Payload
                  mkdir -p export
                  mv "$IPA_FILE" export/
                  ls -la export/

            - name: Publish IPA
              uses: softprops/action-gh-release@v1
              with:
                  files: export/PakePlus-${{ matrix.profile }}-${{ matrix.version }}.ipa
                  tag_name: '${{ matrix.profile }}-v${{ matrix.version }}'
                  name: '${{ matrix.app_name }} v${{ matrix.version }}'
                  body: 'PakePlus iOS build for ${{ matrix.web_url }}'
                  draft: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
