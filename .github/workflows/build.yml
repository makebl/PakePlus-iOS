name: Build IPA

on:
    workflow_dispatch:
    # push:
    #     branches:
    #         - main

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    build:
        runs-on: macos-26

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Xcode
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Sync node version and setup cache
              uses: actions/setup-node@v4
              with:
                  node-version: 22.14.0

            - name: Init Project Config
              run: |
                  pnpm install --no-frozen-lockfile
                  pnpm pp:worker

            - name: Generate AppIcon
              run: |
                  echo "Installing appicon tool..."
                  brew install Nonchalant/appicon/appicon
                  echo "Generating AppIcon..."
                  appicon app-icon.png --output-path ./PakePlus/Assets.xcassets/AppIcon.appiconset

            - name: Build for Release
              run: |
                  xcodebuild -project PakePlus.xcodeproj -scheme PakePlus -configuration Release -sdk iphoneos \
                    CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

            - name: Package IPA
              run: |
                  set +e
                  APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "PakePlus.app" | grep Release-iphoneos | head -n 1)
                  echo "APP_PATH is [$APP_PATH]"
                  if [ -z "$APP_PATH" ]; then
                      echo "ERROR: PakePlus.app not found in DerivedData"
                      find ~/Library/Developer/Xcode/DerivedData -type d -name "*.app" 2>/dev/null | head -20
                      exit 1
                  fi
                  mkdir -p Payload
                  cp -R "$APP_PATH" Payload/
                  NAME="${{ env.NAME }}"
                  VERSION="${{ env.VERSION }}"
                  ISHTML="${{ env.ISHTML }}"
                  echo "NAME=$NAME VERSION=$VERSION ISHTML=$ISHTML"
                  if [ "$ISHTML" = "true" ]; then
                      cp -R ./scripts/www/* ./Payload/PakePlus.app/
                  fi
                  # 用英文文件名避免中文路径问题，发布时再显示中文名
                  IPA_FILE="PakePlus-${VERSION}.ipa"
                  zip -r "$IPA_FILE" Payload
                  mkdir -p export
                  mv "$IPA_FILE" export/
                  ls -la export/

            - name: Publish IPA
              uses: softprops/action-gh-release@v1
              with:
                  files: export/PakePlus-${{ env.VERSION }}.ipa
                  tag_name: 'v${{ env.VERSION }}'
                  name: '${{ env.NAME }} v${{ env.VERSION }}'
                  body: '${{ env.PUBBODY }}'
                  draft: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
